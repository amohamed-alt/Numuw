name: Apply UI stability patch
on:
  push:
    branches: [numuw-redesign]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: numuw-redesign
      - name: Apply patch
        run: |
          sed -i 's/^ diff --git/diff --git/' tool/ui_stability.patch
          git apply tool/ui_stability.patch
          dart format lib/models/ai_assistant_response.dart lib/screens/assistant_screen.dart lib/screens/auth/sign_up_screen.dart lib/screens/quick_log_screen.dart lib/widgets/app_bottom_navigation.dart lib/widgets/quick_log_sheet.dart test/numuw_ui_smoke_test.dart
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "fix: stabilize redesigned UI and tests"
          git push origin numuw-redesign
