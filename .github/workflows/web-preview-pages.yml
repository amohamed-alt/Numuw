name: Validate mobile web preview

on:
  push:
    branches:
      - numuw-redesign
      - feature/figma-parity-foundation
  pull_request:
    branches:
      - numuw-redesign
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: numuw-web-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Run quality checks
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build connected Flutter web preview
        env:
          SUPABASE_URL: https://mwqscuoutmbihexphocx.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_bb3Pg8su9rFSfnkDqNftuQ_GE4r05nL
        run: |
          flutter build web --release \
            --base-href "/Numuw/" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
