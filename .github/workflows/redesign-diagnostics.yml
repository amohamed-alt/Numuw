name: Redesign diagnostics
on:
  push:
    branches: [numuw-redesign]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze > analyze.txt 2>&1 || true
      - run: flutter test -r expanded > test.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: redesign-diagnostics
          path: |
            analyze.txt
            test.txt
          retention-days: 1
