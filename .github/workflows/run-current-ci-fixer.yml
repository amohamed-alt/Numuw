name: Run current CI fixer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: numuw-redesign
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
      - run: python tool/fix_current_ci.py
      - run: dart format lib/models/ai_assistant_response.dart lib/screens/quick_log_screen.dart lib/widgets/app_bottom_navigation.dart lib/widgets/quick_log_sheet.dart test/numuw_ui_smoke_test.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: git diff --exit-code
