name: Run current CI fixer
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: numuw-redesign
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
      - run: python tool/fix_current_ci.py
      - run: dart format lib/models/ai_assistant_response.dart lib/screens/quick_log_screen.dart lib/widgets/app_bottom_navigation.dart lib/widgets/quick_log_sheet.dart test/numuw_ui_smoke_test.dart
      - run: flutter pub get
      - run: flutter analyze
        continue-on-error: true
      - run: flutter test
        continue-on-error: true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git diff --cached --quiet || git commit -m "fix: resolve current redesign CI failures"
          git push origin numuw-redesign
