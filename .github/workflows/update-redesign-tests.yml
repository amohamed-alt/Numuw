name: Update redesign tests

on:
  push:
    branches: [numuw-redesign]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: numuw-redesign
      - name: Rewrite assistant UI tests
        shell: python
        run: |
          from pathlib import Path
          path = Path('test/assistant_screen_test.dart')
          path.write_text("""import 'package:flutter/material.dart';
import 'package:flutter_test/flutter_test.dart';

import 'package:flutter_application_1/models/child_profile.dart';
import 'package:flutter_application_1/screens/assistant_screen.dart';
import 'package:flutter_application_1/state/child_session.dart';

void main() {
  setUp(() {
    ChildSession.instance.setChildren([
      const ChildProfile(
        id: '11111111-1111-4111-8111-111111111111',
        createdBy: '22222222-2222-4222-8222-222222222222',
        name: 'سلمى',
        stage: 'born',
        gender: 'female',
        feedingType: 'formula',
      ),
    ]);
  });

  tearDown(ChildSession.instance.clear);

  testWidgets('assistant screen shows final labels', (tester) async {
    await tester.pumpWidget(const MaterialApp(home: AssistantScreen()));
    expect(find.text('اسألي نُمُوّ'), findsOneWidget);
    expect(find.text('أسئلة مقترحة'), findsOneWidget);
    expect(find.text('لخّصي لي نوم طفلي هذا الأسبوع.'), findsOneWidget);
    expect(find.text('اكتبي سؤالك...'), findsOneWidget);
  });

  testWidgets('assistant shows the privacy reminder', (tester) async {
    await tester.pumpWidget(const MaterialApp(home: AssistantScreen()));
    expect(find.textContaining('غير ضرورية'), findsOneWidget);
  });

  testWidgets('assistant dark mode smoke test', (tester) async {
    await tester.pumpWidget(
      MaterialApp(theme: ThemeData.dark(), home: const AssistantScreen()),
    );
    expect(find.text('اسألي نُمُوّ'), findsOneWidget);
    expect(tester.takeException(), isNull);
  });
}
""", encoding='utf-8')
      - name: Commit test update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/assistant_screen_test.dart
          git commit -m "test: align assistant tests with final UI"
          git push origin numuw-redesign
