name: Numuw production quality

on:
  pull_request:
    branches:
      - design/classy-motherhood-v1
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: numuw-production-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze, test, web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        # The legacy suite still contains one assertion that checks for the old
        # HomeScreen runtime type. The replacement ClassyHomeScreen lazy-load
        # assertion lives in test/main_shell_classy_test.dart and is executed
        # by this same command. Keep every other existing test enabled.
        run: >-
          flutter test
          --name '^(?!.*MainShell lazily creates unopened tabs).*$'

      - name: Build shared home preview
        run: >-
          flutter build web --release
          --dart-define=DESIGN_PREVIEW=true
          --dart-define=HOME_PREVIEW=true

      - name: Capture phone preview
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found; skipping screenshot."
            exit 0
          fi

          python3 -m http.server 8765 --directory build/web >/tmp/numuw-home-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --hide-scrollbars \
            --window-size=430,1200 \
            --virtual-time-budget=7000 \
            --screenshot="$GITHUB_WORKSPACE/numuw-production-home.png" \
            http://127.0.0.1:8765/

      - name: Upload visual preview
        uses: actions/upload-artifact@v4
        with:
          name: numuw-production-home-preview
          path: numuw-production-home.png
          if-no-files-found: warn
          retention-days: 14

  android:
    name: Android compile check
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

  ios:
    name: iOS compile check
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Build iOS without signing
        run: flutter build ios --debug --no-codesign
