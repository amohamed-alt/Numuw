name: Commit CI diagnostics

on:
  push:
    branches: [numuw-redesign]

permissions:
  contents: write

jobs:
  diagnostics:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: numuw-redesign
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
      - run: flutter pub get
      - name: Capture analyze and test output
        shell: bash
        run: |
          mkdir -p .github/diagnostics
          flutter analyze --no-fatal-infos > .github/diagnostics/analyze.txt 2>&1 || true
          flutter test -r expanded > .github/diagnostics/test.txt 2>&1 || true
          {
            echo '# Latest Numuw redesign CI diagnostics'
            echo
            echo "Generated from commit: ${GITHUB_SHA}"
            echo
            echo '## Analyze summary'
            grep -E "^(error|warning|info) •|[0-9]+ issues? found" .github/diagnostics/analyze.txt | head -120 || true
            echo
            echo '## Test summary'
            grep -E "^(00:|\+|\-|Some tests failed|All tests passed|Failed to load)" .github/diagnostics/test.txt | tail -120 || true
          } > .github/diagnostics/summary.md
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/diagnostics/analyze.txt .github/diagnostics/test.txt .github/diagnostics/summary.md
          git commit -m "ci: update redesign diagnostics" || exit 0
          git push origin numuw-redesign
