name: Redesign PR diagnostics
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
      - run: flutter pub get
      - name: Analyze
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos > analyze.txt 2>&1
          cat analyze.txt
      - name: Test
        continue-on-error: true
        run: |
          flutter test -r expanded > test.txt 2>&1
          cat test.txt
      - uses: actions/upload-artifact@v4
        with:
          name: redesign-diagnostics
          path: |
            analyze.txt
            test.txt
          retention-days: 1
