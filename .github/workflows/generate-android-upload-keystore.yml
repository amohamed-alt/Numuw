name: Generate Android upload keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEY_ALIAS: numuw
    steps:
      - name: Validate signing secrets
        run: |
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing GitHub secret ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing GitHub secret ANDROID_KEY_PASSWORD" && exit 1)

      - name: Generate encrypted upload keystore
        run: |
          keytool -genkeypair \
            -keystore numuw-upload-keystore.jks \
            -storetype JKS \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Numuw, OU=Mobile, O=Numuw, L=Cairo, ST=Cairo, C=EG"

      - name: Print certificate fingerprint
        run: |
          keytool -list -v \
            -keystore numuw-upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | grep -E "SHA1:|SHA256:|Valid from:"

      - name: Upload keystore for secure backup
        uses: actions/upload-artifact@v4
        with:
          name: numuw-upload-keystore
          path: numuw-upload-keystore.jks
          retention-days: 1
          if-no-files-found: error
