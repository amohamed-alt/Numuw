name: Fix redesign analyze issues

on:
  push:
    branches:
      - numuw-redesign

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: numuw-redesign
      - name: Apply source fixes
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('lib/screens/quick_log_screen.dart'): (
                  '            minHeight: 72,',
                  '            constraints: const BoxConstraints(minHeight: 72),',
              ),
              Path('lib/widgets/quick_log_sheet.dart'): (
                  '                                minHeight: 70,',
                  '                                constraints: const BoxConstraints(minHeight: 70),',
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if old in text:
                  path.write_text(text.replace(old, new, 1), encoding='utf-8')

          prefs = Path('lib/state/app_preferences.dart')
          text = prefs.read_text(encoding='utf-8')
          text = text.replace("import 'package:flutter/foundation.dart';\n", '', 1)
          prefs.write_text(text, encoding='utf-8')
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/quick_log_screen.dart lib/widgets/quick_log_sheet.dart lib/state/app_preferences.dart
          git commit -m "fix: resolve redesign Flutter analyze issues"
          git push origin numuw-redesign
