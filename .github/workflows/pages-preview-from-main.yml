name: Deploy Numuw preview

# Builds the current Figma-parity Flutter branch while deploying from main so
# GitHub Pages environment protection can remain scoped to the default branch.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages-preview-from-main.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: numuw-pages-preview-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout preview source
        uses: actions/checkout@v6
        with:
          ref: feature/figma-parity-foundation

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Run quality checks
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build connected Flutter web preview
        env:
          SUPABASE_URL: https://mwqscuoutmbihexphocx.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_bb3Pg8su9rFSfnkDqNftuQ_GE4r05nL
        run: |
          flutter build web --release \
            --base-href "/Numuw/" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
