name: Deploy Numuw UI review

# Deploys the current Organic production-foundation branch as an isolated
# UI review candidate. Review mode never reads or writes production data.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pages-preview-from-main.yml'
      - '.github/preview-trigger-*.txt'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: numuw-pages-ui-review
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Organic review source
        uses: actions/checkout@v6
        with:
          ref: feat/organic-production-foundation

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Run quality checks
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build isolated UI review
        run: |
          flutter build web --release \
            --target lib/main_ui_review.dart \
            --source-maps \
            --base-href "/Numuw/"

      - name: Verify Flutter web runtime
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium browser is available on the runner."
            exit 1
          fi
          rm -rf /tmp/numuw-pages /tmp/numuw-chrome-profile
          mkdir -p /tmp/numuw-pages/Numuw
          cp -a build/web/. /tmp/numuw-pages/Numuw/
          python3 -m http.server 8765 --directory /tmp/numuw-pages >/tmp/numuw-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          set +e
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --no-first-run --no-default-browser-check --user-data-dir=/tmp/numuw-chrome-profile --virtual-time-budget=15000 --dump-dom http://127.0.0.1:8765/Numuw/ >/tmp/numuw-dom.html 2>/tmp/numuw-chrome.log
          CHROME_EXIT=$?
          set -e
          if [ "$CHROME_EXIT" -ne 0 ] || ! grep -q "flt-glass-pane" /tmp/numuw-dom.html; then
            echo "Flutter did not attach a rendered view during the UI review smoke test."
            tail -200 /tmp/numuw-chrome.log || true
            tail -180 /tmp/numuw-dom.html || true
            exit 1
          fi
          echo "Numuw UI review runtime smoke test passed."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy UI review
        id: deployment
        uses: actions/deploy-pages@v4
