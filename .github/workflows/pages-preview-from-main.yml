name: Deploy Numuw preview

# Builds the current Figma-parity Flutter branch while deploying from main so
# GitHub Pages environment protection can remain scoped to the default branch.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages-preview-from-main.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: numuw-pages-preview-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout preview source
        uses: actions/checkout@v6
        with:
          ref: feature/figma-parity-foundation

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Run quality checks
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build connected Flutter web preview
        env:
          SUPABASE_URL: https://mwqscuoutmbihexphocx.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_bb3Pg8su9rFSfnkDqNftuQ_GE4r05nL
        run: |
          flutter build web --release \
            --source-maps \
            --base-href "/Numuw/" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Verify Flutter web runtime
        shell: bash
        run: |
          set -euo pipefail

          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium browser is available on the runner."
            exit 1
          fi

          rm -rf /tmp/numuw-pages /tmp/numuw-chrome-profile
          mkdir -p /tmp/numuw-pages/Numuw
          cp -a build/web/. /tmp/numuw-pages/Numuw/

          python3 -m http.server 8765 --directory /tmp/numuw-pages >/tmp/numuw-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1

          set +e
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --no-first-run \
            --no-default-browser-check \
            --user-data-dir=/tmp/numuw-chrome-profile \
            --virtual-time-budget=15000 \
            --dump-dom \
            http://127.0.0.1:8765/Numuw/ \
            >/tmp/numuw-dom.html 2>/tmp/numuw-chrome.log
          CHROME_EXIT=$?
          set -e

          RUNTIME_FAILED=0
          if [ "$CHROME_EXIT" -ne 0 ] || grep -q 'id="numuw-boot-status"[^>]*data-error=' /tmp/numuw-dom.html || ! grep -q "flt-glass-pane" /tmp/numuw-dom.html; then
            RUNTIME_FAILED=1
          fi

          if [ "$RUNTIME_FAILED" -eq 1 ]; then
            echo "Flutter did not attach a rendered view during the Pages smoke test."
            echo "--- Runtime exception ---"
            python3 - <<'PY'
          import html
          import re
          from pathlib import Path

          dom = Path('/tmp/numuw-dom.html').read_text(errors='replace')
          match = re.search(r'data-error="([^"]*)"', dom, flags=re.S)
          if match:
              error = html.unescape(match.group(1))
              print(error)
              pos = re.search(r'main\.dart\.js:(\d+):(\d+)', error)
              if pos:
                  Path('/tmp/numuw-js-position').write_text(f'{pos.group(1)} {pos.group(2)}')
          else:
              print('No bootstrap data-error was captured.')
          PY

            if [ -s /tmp/numuw-js-position ] && [ -f build/web/main.dart.js.map ]; then
              read STACK_LINE STACK_COL < /tmp/numuw-js-position
              echo "--- Source-map resolution for main.dart.js:${STACK_LINE}:${STACK_COL} ---"
              npm install --silent --no-save --prefix /tmp/numuw-sourcemap source-map@0.7.4
              STACK_LINE="$STACK_LINE" STACK_COL="$STACK_COL" NODE_PATH=/tmp/numuw-sourcemap/node_modules node <<'NODE'
          const fs = require('fs');
          const { SourceMapConsumer } = require('source-map');
          const raw = JSON.parse(fs.readFileSync('build/web/main.dart.js.map', 'utf8'));
          const line = Number(process.env.STACK_LINE);
          const browserColumn = Number(process.env.STACK_COL);

          SourceMapConsumer.with(raw, null, consumer => {
            for (const column of [Math.max(0, browserColumn - 1), browserColumn]) {
              const position = consumer.originalPositionFor({
                line,
                column,
                bias: SourceMapConsumer.GREATEST_LOWER_BOUND,
              });
              console.log(JSON.stringify({ generated: { line, column }, original: position }));
            }
          });
          NODE
            fi

            echo "--- Generated web plugin registrants ---"
            find .dart_tool build -type f \( -iname '*plugin*registrant*.dart' -o -iname '*web_plugin*.dart' \) -print -exec sh -c 'echo "### $1"; sed -n "1,260p" "$1"' _ {} \; 2>/dev/null || true
            echo "--- Chrome log ---"
            tail -200 /tmp/numuw-chrome.log || true
            echo "--- HTTP log ---"
            tail -100 /tmp/numuw-http.log || true
            echo "--- DOM tail ---"
            tail -180 /tmp/numuw-dom.html || true
            exit 1
          fi

          echo "Flutter web runtime smoke test passed."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
