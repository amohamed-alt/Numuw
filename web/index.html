<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="نُمُوّ — تطبيق عربي لمتابعة الأمومة ورعاية الطفل.">
  <meta name="theme-color" content="#0F1923">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="نُمُوّ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>نُمُوّ | Numuw</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      min-width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #0F1923;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #numuw-boot-status {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
      color: #F7F3EA;
      background: #0F1923;
    }

    #numuw-boot-status::before {
      content: "ن";
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      margin-bottom: 4px;
      background: #E8B86D;
      color: #0F1923;
      font-size: 28px;
      font-weight: 800;
      box-shadow: 0 0 32px rgba(232, 184, 109, 0.24);
    }

    #numuw-boot-status strong {
      font-size: 20px;
    }

    #numuw-boot-status span {
      max-width: 340px;
      color: #AAB4BE;
      font-size: 14px;
      line-height: 1.7;
    }

    #numuw-boot-status.is-error::before {
      content: "!";
    }
  </style>
</head>
<body>
  <div id="numuw-boot-status" role="status" aria-live="polite">
    <strong>جاري تشغيل نُمُوّ…</strong>
    <span>لحظات ونجهّز لكِ التجربة.</span>
  </div>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
