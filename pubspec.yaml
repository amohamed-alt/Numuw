name: flutter_application_1
description: "Numuw Arabic motherhood MVP."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  package_info_plus: ^10.2.0
  pdf: ^3.11.3
  printing: ^5.14.2
  shared_preferences: ^2.5.4
  supabase_flutter: ^2.15.0
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  fl_chart: ^1.2.0
  share_plus: ^13.2.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoNaskhArabic-Regular.ttf
    - assets/fonts/Cairo-VariableFont_slnt,wght.ttf
  fonts:
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-VariableFont_slnt,wght.ttf
